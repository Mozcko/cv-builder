name: CI Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    name: 🛡️ Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'cvstudio-tools/pnpm-lock.yaml'

      - name: Install Dependencies
        run: cd cvstudio-tools && pnpm install --frozen-lockfile

      - name: Run Linter
        run: cd cvstudio-tools && pnpm lint

      - name: Build Project
        run: cd cvstudio-tools && pnpm build

  backend-qa:
    name: 🐍 Backend QA (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cvstudio-tools-backend/requirements.txt
          # Ensure test dependencies from Phase 4 are present
          pip install pytest pytest-asyncio httpx pytest-mock

      - name: Run Backend Tests
        run: |
          cd cvstudio-tools-backend
          export PYTHONPATH=$PYTHONPATH:.
          pytest test/

  frontend-e2e:
    name: 🎭 Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    # Needs build to run local server during E2E
    needs: build-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'cvstudio-tools/pnpm-lock.yaml'

      - name: Install Dependencies
        run: cd cvstudio-tools && pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: cd cvstudio-tools && pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        run: |
          cd cvstudio-tools
          # We run the dev server in background for E2E
          # In a real CI, we might use a preview build or start-server-and-test
          pnpm run dev &
          sleep 10
          pnpm run test:e2e
